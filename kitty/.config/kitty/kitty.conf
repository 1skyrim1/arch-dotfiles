font_family JetBrainsMono Nerd Font
font_size   12.0

shell             zsh
shell_integration disabled

cursor_shape block

url_style         curly
disable_ligatures never

cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color           none
custom_shaders               cursor-trail-blaze

window_padding_width          10
background_opacity            0.92
dynamic_background_opacity    yes
background_blur               8
scrollbar                     never
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0
scrollbar_handle_opacity      0


confirm_os_window_close 0
enable_audio_bell       no
bell_on_tab             "🔔 "

copy_on_select clipboard

sync_to_monitor no

# Colors made from the wallpaper (written by matugen to
# ~/.config/matugen/templates/kitty.conf).
include colors.conf
