# Terminal colors, made from the wallpaper.
#
# Generated by matugen every time the wallpaper changes (Theme.qml runs
# it). Don't edit this file: your changes would be overwritten. Change the
# template in ~/.config/matugen/templates/kitty.conf instead.

# ── Text, background, cursor, selection ──────────────────────────────────

foreground            {{colors.on_surface.default.hex}}
background            {{colors.surface.default.hex}}
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}
selection_foreground  {{colors.on_primary.default.hex}}
selection_background  {{colors.primary.default.hex}}
url_color             {{colors.tertiary.default.hex}}

# ── Window borders and tabs (when kitty shows several) ───────────────────

active_border_color      {{colors.primary.default.hex}}
inactive_border_color    {{colors.outline_variant.default.hex}}
bell_border_color        {{colors.tertiary.default.hex}}
tab_bar_background       {{colors.surface_container.default.hex}}
active_tab_foreground    {{colors.on_primary.default.hex}}
active_tab_background    {{colors.primary.default.hex}}
inactive_tab_foreground  {{colors.on_surface_variant.default.hex}}
inactive_tab_background  {{colors.surface_container_high.default.hex}}

# ── The 16 terminal colors ───────────────────────────────────────────────
#
# What programs (ls, git, your zsh prompt, …) mean by "red", "green", …
# The six colors come from matugen's custom colors (see config.toml): the
# classic terminal colors, shifted toward the wallpaper's colors so they
# fit in. The "bright" versions (8–15) are the same, a bit lighter.

# black, and "bright black" (used for dimmed text, e.g. comments)
color0   {{colors.surface_container_highest.default.hex}}
color8   {{colors.outline.default.hex}}

color1   {{colors.red.default.hex}}
color9   {{colors.red.default.hex | lighten: 10}}

color2   {{colors.green.default.hex}}
color10  {{colors.green.default.hex | lighten: 10}}

color3   {{colors.yellow.default.hex}}
color11  {{colors.yellow.default.hex | lighten: 10}}

color4   {{colors.blue.default.hex}}
color12  {{colors.blue.default.hex | lighten: 10}}

color5   {{colors.magenta.default.hex}}
color13  {{colors.magenta.default.hex | lighten: 10}}

color6   {{colors.cyan.default.hex}}
color14  {{colors.cyan.default.hex | lighten: 10}}

# white, and bright white
color7   {{colors.on_surface_variant.default.hex}}
color15  {{colors.on_surface.default.hex}}
