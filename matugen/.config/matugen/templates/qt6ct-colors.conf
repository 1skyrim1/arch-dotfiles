# Qt colors, made from the wallpaper, as a qt6ct color scheme.
#
# Generated by matugen every time the wallpaper changes (Theme.qml runs
# it). Don't edit this file: your changes would be overwritten. Change the
# template in ~/.config/matugen/templates/qt6ct-colors.conf instead.
#
# Each line lists 21 colors, one per role, always in this order:
#
#    1 WindowText       window text           12 Shadow            drop shadows
#    2 Button           button background     13 Highlight         selection
#    3 Light            3D edge, lightest     14 HighlightedText   text on selection
#    4 Midlight         3D edge, lighter      15 Link
#    5 Dark             3D edge, darker       16 LinkVisited
#    6 Mid              3D edge, middle       17 AlternateBase     every 2nd list row
#    7 Text             text in fields        18 NoRole            (unused)
#    8 BrightText       text on dark spots    19 ToolTipBase       tooltip background
#    9 ButtonText       button text           20 ToolTipText       tooltip text
#   10 Base             fields, lists         21 PlaceholderText   hint text in fields
#   11 Window           window background
#
# Colors are #rrggbb, or #aarrggbb with transparency in front. Disabled
# widgets get their text at 38% opacity (#61), as Material Design does.

[ColorScheme]
active_colors={{colors.on_surface.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.surface_bright.default.hex}}, {{colors.surface_container_highest.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.surface_container_low.default.hex}}, {{colors.surface.default.hex}}, {{colors.shadow.default.hex}}, {{colors.primary.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.surface.default.hex}}, {{colors.surface_container_highest.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface_variant.default.hex}}
inactive_colors={{colors.on_surface.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.surface_bright.default.hex}}, {{colors.surface_container_highest.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.surface_container_low.default.hex}}, {{colors.surface.default.hex}}, {{colors.shadow.default.hex}}, {{colors.primary.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.surface.default.hex}}, {{colors.surface_container_highest.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface_variant.default.hex}}
disabled_colors=#61{{colors.on_surface.default.hex_stripped}}, {{colors.surface_container_high.default.hex}}, {{colors.surface_bright.default.hex}}, {{colors.surface_container_highest.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface_container.default.hex}}, #61{{colors.on_surface.default.hex_stripped}}, #61{{colors.on_surface.default.hex_stripped}}, #61{{colors.on_surface.default.hex_stripped}}, {{colors.surface_container_low.default.hex}}, {{colors.surface.default.hex}}, {{colors.shadow.default.hex}}, {{colors.surface_container_highest.default.hex}}, #61{{colors.on_surface.default.hex_stripped}}, {{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.surface.default.hex}}, {{colors.surface_container_highest.default.hex}}, {{colors.on_surface.default.hex}}, #61{{colors.on_surface_variant.default.hex_stripped}}

